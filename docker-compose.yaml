services:
  # Base de données PostgreSQL (Port NON publié sur l'hôte selon la consigne du professeur)
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parisdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    # Port non publié pour respecter la sécurité exigée (communication interne au réseau Docker uniquement)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - paris-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-parisdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Flask)
  backend:
    image: ${DOCKER_USERNAME:-moetezmechmech}/paris-backend:${APP_VERSION:-v1.0.0}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-parisdb}
      POSTGRES_SERVICE: db  
      POSTGRES_PORT: 5432
      LIMIT_EXAMPLES: 100
      FLASK_DEBUG: "false"
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - paris-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend Web (Nginx)
  frontend:
    image: ${DOCKER_USERNAME:-moetezmechmech}/paris-frontend:${APP_VERSION:-v1.0.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      API_URL: http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - paris-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

networks:
  paris-network:
    driver: bridge
