name: Pipeline CI/CD - DevOps ParisTrees

on:
  # 1. Déclenchement sur Merge Request / Pull Request (Exigence Point 5 du prof)
  pull_request:
    branches:
      - master
      - main

  # 2. Déclenchement sur Push direct (master/main)
  push:
    branches:
      - master
      - main
    # Déclenchement automatique lors de la publication d'un tag vX.Y.Z (Bonus +2 pts)
    tags:
      - 'v*'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'moetezmechmech' }}

jobs:
  # ============================================================================
  # ÉTAPE 1 : TESTS UNITAIRES + MATRICE DE VERSIONS (Point 5 + Bonus Matrice +1 pt)
  # ============================================================================
  test:
    name: Tests unitaires (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Exécution du pipeline sur 2 versions du langage (Bonus +1 pt)
        python-version: ["3.9", "3.10"]

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installation des dépendances applicatives et de test
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/app/requirements.txt
          pip install -r backend/requirements-test.txt

      - name: Exécution des tests unitaires avec génération du rapport XML
        run: |
          mkdir -p reports
          pytest backend/tests/ --junitxml=reports/test-results-${{ matrix.python-version }}.xml -v

      # Publication du rapport de tests en tant qu'artefact (Exigence Point 5)
      - name: Archivage du rapport de tests en artefact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests-python-${{ matrix.python-version }}
          path: reports/test-results-${{ matrix.python-version }}.xml
          retention-days: 7

  # ============================================================================
  # ÉTAPE 2 : CONSTRUCTION ET PUBLICATION DES IMAGES DOCKER (Point 5 & 6)
  # Conditionné au succès des tests grâce à 'needs: [test]'
  # ============================================================================
  build-and-push:
    name: Construction et publication des images Docker
    needs: [test]
    runs-on: ubuntu-22.04

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Détermination du tag de version (vX.Y.Z ou commit SHA)
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="pr-${{ github.event.pull_request.number }}"
          else
            VERSION="v1.0.0-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version sélectionnée : ${VERSION}"

      # Connexion uniquement lors d'un push pour publication
      - name: Connexion au registre Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'moetezmechmech' }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN }}

      - name: Construction (et publication si push) de l'image Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKER_USERNAME }}/paris-backend:${{ steps.versioning.outputs.VERSION }}
            ${{ env.DOCKER_USERNAME }}/paris-backend:latest

      - name: Construction (et publication si push) de l'image Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKER_USERNAME }}/paris-frontend:${{ steps.versioning.outputs.VERSION }}
            ${{ env.DOCKER_USERNAME }}/paris-frontend:latest

    outputs:
      app_version: ${{ steps.versioning.outputs.VERSION }}

  # ============================================================================
  # ÉTAPE 3 : MISE EN SERVICE EN TEST & CONTRÔLE DE SANTÉ (Point 6 & Bonus Tag +2 pts)
  # Les images publiées sont téléchargées et JAMAIS reconstruites localement.
  # ============================================================================
  deploy-and-verify:
    name: Mise en service & Contrôle de santé
    needs: [build-and-push]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de l'environnement de déploiement
        run: |
          echo "DOCKER_USERNAME=${{ env.DOCKER_USERNAME }}" >> .env
          echo "APP_VERSION=${{ needs.build-and-push.outputs.app_version }}" >> .env
          chmod +x check_health.sh scripts/rollback.sh

      - name: Téléchargement des images publiées (JAMAIS RECONSTRUITES)
        run: |
          APP_VERSION=${{ needs.build-and-push.outputs.app_version }} docker compose pull

      - name: Démarrage des conteneurs en environnement de test
        run: |
          APP_VERSION=${{ needs.build-and-push.outputs.app_version }} docker compose up -d --no-build

      - name: Contrôle de santé automatisé via le script Bash (Point 2 & Point 6)
        run: |
          ./check_health.sh
